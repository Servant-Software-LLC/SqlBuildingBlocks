name: Build

# Continuous integration: build + test + coverage on every push and PR.
# Publishing to NuGet lives in release.yml (push a vX.Y.Z tag).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BuildConfiguration: Release

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # coverage PR comment (marocchino/sticky-pull-request-comment)

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Assert global.json SDK matches Directory.Build.props NetTFM (closes class behind #134)
      shell: pwsh
      run: |
        $sdkVersion = (Get-Content global.json | ConvertFrom-Json).sdk.version
        $sdkMajorMinor = ($sdkVersion -split '\.')[0..1] -join '.'
        $xml = [xml](Get-Content Directory.Build.props)
        $tfmNode = $xml.SelectSingleNode('//PropertyGroup/NetTFM')
        if ($null -eq $tfmNode) {
          Write-Error "Directory.Build.props is missing a <NetTFM> element under any <PropertyGroup>."
          exit 1
        }
        $tfmRaw = $tfmNode.InnerText.Trim()
        $tfm = $tfmRaw -replace '^net', ''
        Write-Host "global.json sdk.version: $sdkVersion (major.minor: $sdkMajorMinor)"
        Write-Host "Directory.Build.props NetTFM: $tfmRaw (major.minor: $tfm)"
        if ($sdkMajorMinor -ne $tfm) {
          Write-Error "SDK/TFM mismatch: global.json sdk.version major.minor '$sdkMajorMinor' does not equal Directory.Build.props NetTFM major.minor '$tfm'. Update one of them."
          exit 1
        }

    - name: Set version number
      run:  '& ${{github.workspace}}/.github/workflows/UpdateVersion.ps1 ${{github.run_number}}'
      shell: pwsh

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration $BuildConfiguration


    - name: Test
      run: dotnet test --configuration $BuildConfiguration --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Create nuget packages
      run: dotnet pack --configuration $BuildConfiguration --no-build

    - uses: actions/upload-artifact@v7
      with:
        name: Nuget Packages
        path: ${{github.workspace}}/src/**/*.nupkg

    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Merge and generate coverage report
      run: |
        reportgenerator \
          -reports:"coverage/**/coverage.cobertura.xml" \
          -targetdir:"coverage/report" \
          -reporttypes:"MarkdownSummaryGithub;Cobertura" \
          -assemblyfilters:"-*.Tests"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        files: coverage/report/Cobertura.xml
        fail_ci_if_error: false

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v3
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: coverage/report/SummaryGithub.md
